<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#eef2f7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fiyat">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>Fiyat Listesi — Hızlı Arama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f7; --card:#ffffff; --line:#e6eaf0; --txt:#0f172a; --mut:#64748b; --mut2:#94a3b8;
  --acc:#2563eb; --acc-soft:#dbeafe; --acc-ink:#1e40af;
  --ok:#059669; --ok-soft:#d1fae5; --warn:#d97706; --warn-soft:#fef3c7; --red:#dc2626; --red-soft:#fee2e2;
  --r:16px; --sh:0 1px 2px rgba(15,23,42,.04),0 8px 24px -12px rgba(15,23,42,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);font-size:16px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(900px 400px at 10% -10%,#dbeafe 0%,transparent 60%),radial-gradient(700px 400px at 100% 0%,#e0f2fe 0%,transparent 60%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:20px 20px 120px}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;animation:fadeDown .5s ease both}
.brand h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.brand p{color:var(--mut);font-size:14px;margin-top:2px}
.dates{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mut);box-shadow:var(--sh)}
.pill b{color:var(--txt)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}

/* modes */
.modes{display:inline-flex;background:#e2e8f0;border-radius:14px;padding:4px;gap:4px;margin-bottom:14px;animation:fadeDown .5s .03s ease both}
.modes button{border:0;background:transparent;font:inherit;font-weight:800;font-size:15px;color:var(--mut);padding:9px 22px;border-radius:11px;cursor:pointer;transition:all .25s cubic-bezier(.2,.8,.2,1);display:inline-flex;align-items:center;gap:7px}
.modes button.on{background:#fff;color:var(--txt);box-shadow:0 2px 8px rgba(15,23,42,.12)}
.mdot{width:8px;height:8px;border-radius:50%;background:#cbd5e1;display:inline-block;transition:background .3s}
.mdot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(5,150,105,.18)}
.mdot.old{background:var(--warn)}
.mdot.err{background:var(--red)}
.sbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 2px 12px;font-size:13px;color:var(--mut)}
.sbar .pill{padding:5px 10px;font-size:12px}
.srow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);transition:background .18s;animation:up .3s ease both}
.srow:last-child{border-bottom:0}
.srow:hover{background:#f8fafc}
.srow .n{font-weight:700;font-size:16px}
.srow .n small{display:block;color:var(--mut);font-weight:500;font-size:12.5px;margin-top:2px}
.srow .tot{text-align:right;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.srow .tot small{display:block;font-size:11px;color:var(--mut2);font-weight:700;letter-spacing:.05em}
.srow .deps{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.dep{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;background:#f1f5f9;color:var(--mut2);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.dep.has{background:var(--acc-soft);color:var(--acc-ink)}
.dep b{font-size:13px}
.srow.zero .tot{color:var(--mut2)}
/* search */
.search{position:sticky;top:12px;z-index:5;animation:fadeDown .5s .05s ease both;display:flex;flex-direction:column;gap:10px}
.search .seg{align-self:flex-start}
.fabm{display:none}
.closem{display:none}
.backdrop{display:none}
.sbox{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:6px 10px 6px 18px;box-shadow:0 10px 30px -14px rgba(37,99,235,.35),var(--sh);transition:border-color .25s,box-shadow .25s,transform .25s}
.sbox:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px rgba(37,99,235,.12),0 14px 36px -14px rgba(37,99,235,.45);transform:translateY(-1px)}
.sbox svg{flex:none;color:var(--mut2)}
.sbox input{flex:1;border:0;outline:0;font:inherit;font-size:22px;font-weight:600;padding:12px 0;background:transparent;color:var(--txt);min-width:0}
.sbox input::placeholder{color:#b6c0ce;font-weight:500}
.kbd{display:none;gap:4px;color:var(--mut2);font-size:12px}
.kbd span{border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 7px;background:#f8fafc}
@media(min-width:760px){.kbd{display:flex}}
.clear{display:none;border:0;background:#f1f5f9;color:var(--mut);width:36px;height:36px;border-radius:12px;cursor:pointer;font-size:18px;transition:background .2s}
.clear:hover{background:#e2e8f0}
.sbox.has .clear{display:block}

/* chips */
.rows{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0 6px;animation:fadeDown .5s .1s ease both}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--sh);gap:2px}
.seg button{border:0;background:transparent;font:inherit;font-weight:700;font-size:14px;color:var(--mut);padding:8px 14px;border-radius:10px;cursor:pointer;transition:all .25s cubic-bezier(.2,.8,.2,1)}
.seg button.on{background:var(--acc);color:#fff;box-shadow:0 6px 14px -6px rgba(37,99,235,.6)}
.seg button.on.warn{background:var(--warn);box-shadow:0 6px 14px -6px rgba(217,119,6,.6)}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);font:inherit;font-size:13px;font-weight:600;color:var(--mut);padding:7px 12px;border-radius:999px;cursor:pointer;transition:all .22s;box-shadow:var(--sh)}
.chip:hover{border-color:#cbd5e1;color:var(--txt);transform:translateY(-1px)}
.chip.on{background:var(--txt);color:#fff;border-color:var(--txt)}
.seg button{white-space:nowrap}
.meta{color:var(--mut);font-size:13px;margin:8px 2px 12px;min-height:18px}

/* layout */
.grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
@media(max-width:980px){.grid{grid-template-columns:1fr}}

/* group cards */
.group{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:16px;overflow:hidden;animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.ghead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff,#fafbfd)}
.ghead h2{font-size:15px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.ghead h2 i{width:10px;height:10px;border-radius:3px;background:var(--acc);display:inline-block}
.ghead small{color:var(--mut2);font-weight:600;font-size:12px}
.cols{display:grid;grid-template-columns:1.4fr repeat(4,1fr) 90px;gap:8px;padding:8px 18px;font-size:11px;font-weight:700;color:var(--mut2);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--line)}
.cols span:not(:first-child){text-align:right}
.cols span.v{color:var(--acc)}
.row{display:grid;grid-template-columns:1.4fr repeat(4,1fr) 90px;gap:8px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .18s,transform .18s;position:relative}
.row:last-child{border-bottom:0}
.row:hover{background:#f8fafc}
.row.sel{background:var(--acc-soft)}
.row.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--acc);border-radius:0 4px 4px 0}
.row .n{font-weight:700;font-size:16px}
.row .n small{display:block;color:var(--mut);font-weight:500;font-size:13px;margin-top:2px}
.row .p{text-align:right;font-variant-numeric:tabular-nums;font-size:15px;color:var(--mut);font-weight:500;transition:all .25s}
.row .p.v{color:var(--txt);font-weight:800;font-size:18px}
.row .p.v::after{content:"";display:block;height:3px;border-radius:3px;background:var(--acc);margin:3px 0 0 auto;width:60%;transform-origin:right;animation:bar .35s cubic-bezier(.2,.8,.2,1) both}
.tag{justify-self:end;font-size:11px;font-weight:700;padding:4px 8px;border-radius:999px;background:#f1f5f9;color:var(--mut);white-space:nowrap}
.tag.ask{background:var(--warn-soft);color:#92400e}
.tag.red{background:var(--red-soft);color:#991b1b}
.hl{background:#fef08a;border-radius:3px;padding:0 1px}
@media(max-width:980px){
  .cols{display:none}
  .row{grid-template-columns:1fr auto;grid-template-areas:"n v" "n t"}
  .row .n{grid-area:n}.row .p{display:none}.row .p.v{display:block;grid-area:v;font-size:20px}
  .row .p.v::after{width:100%}
  .tag{grid-area:t;margin-top:4px}
}

/* discounts */
.disc{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.dcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;animation:up .45s cubic-bezier(.2,.8,.2,1) both}
.dcard h3{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.dcard h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.drow{display:grid;grid-template-columns:1.3fr repeat(4,1fr);gap:6px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.drow:last-child{border-bottom:0}
.drow b{font-weight:700}
.drow span{text-align:center;color:var(--mut);font-variant-numeric:tabular-nums;border-radius:8px;padding:4px 2px;transition:all .25s}
.drow span.v{background:var(--acc-soft);color:var(--acc-ink);font-weight:800}
.drow.h{font-size:11px;color:var(--mut2);text-transform:uppercase;letter-spacing:.05em;font-weight:700;padding:4px 0}
.drow.h span{color:var(--mut2)}

/* calc panel */
.panel{position:sticky;top:96px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;animation:up .5s .15s cubic-bezier(.2,.8,.2,1) both}
.phead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.phead h2{font-size:15px;font-weight:800}
.phead button{border:0;background:#f1f5f9;color:var(--mut);font:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer}
.pbody{padding:14px 18px}
.empty{color:var(--mut2);font-size:14px;text-align:center;padding:26px 10px;line-height:1.5}
.item{display:grid;grid-template-columns:1fr 92px;gap:8px 10px;padding:10px 0;border-bottom:1px solid var(--line);animation:pop .3s cubic-bezier(.2,.8,.2,1) both}
.item:last-child{border-bottom:0}
.item .t{font-weight:700;font-size:14px;line-height:1.3}
.item .t small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.item .t em{font-style:normal;color:var(--acc-ink);font-weight:700;font-size:12px}
.item input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-weight:700;font-size:15px;text-align:right;outline:0;transition:border-color .2s,box-shadow .2s}
.item input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.item .amt{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut)}
.item .amt b{font-size:16px;color:var(--txt);font-variant-numeric:tabular-nums}
.item .rm{border:0;background:transparent;color:var(--mut2);cursor:pointer;font-size:16px;padding:0 4px}
.item .rm:hover{color:var(--red)}
.total{margin-top:12px;padding:14px;border-radius:12px;background:linear-gradient(135deg,#1e40af,#2563eb);color:#fff;display:flex;justify-content:space-between;align-items:center;box-shadow:0 10px 24px -10px rgba(37,99,235,.7)}
.total small{display:block;opacity:.8;font-size:12px;font-weight:600}
.total b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.opts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--mut);cursor:pointer;user-select:none}
.tog i{width:34px;height:20px;border-radius:999px;background:#e2e8f0;position:relative;transition:background .25s}
.tog i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.tog.on i{background:var(--acc)}.tog.on i::after{transform:translateX(14px)}
.copy{width:100%;margin-top:10px;border:1.5px solid var(--line);background:#fff;font:inherit;font-weight:700;font-size:14px;padding:10px;border-radius:12px;cursor:pointer;transition:all .2s}
.copy:hover{border-color:var(--acc);color:var(--acc)}
.copy.done{background:var(--ok-soft);border-color:var(--ok);color:#065f46}

.notes{margin-top:20px;background:var(--warn-soft);border:1px solid #fde68a;border-radius:var(--r);padding:14px 18px;font-size:14px;color:#78350f;line-height:1.6;animation:up .5s .2s ease both}
.notes b{font-weight:800}
.none{background:var(--card);border:1px dashed #cbd5e1;border-radius:var(--r);padding:40px;text-align:center;color:var(--mut);font-size:15px;animation:up .4s ease both}
.none b{display:block;font-size:18px;color:var(--txt);margin-bottom:6px}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--txt);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.8,.2,1);z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}

@keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
/* ================= TELEFON ================= */
@media(max-width:980px){
  .wrap{padding:14px 12px 170px}
  .top{margin-bottom:10px}
  .modes{width:100%;display:flex}.modes button{flex:1;justify-content:center;padding:10px}.brand h1{font-size:22px}.brand p{display:none}
  .dates{gap:6px}.pill{padding:5px 10px;font-size:12px}
  .search{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:30;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(238,242,247,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.7);gap:8px;animation:none}
  .search .seg{align-self:stretch;width:100%;justify-content:space-between}.seg button{padding:10px 2px;font-size:12.5px;flex:1;min-width:0}
  .sbox{border-radius:18px;padding:4px 6px 4px 14px}.sbox input{font-size:19px;padding:12px 0}.kbd{display:none}
  .clear{width:40px;height:40px;border-radius:12px}
  .fabm{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--txt);color:#fff;height:44px;padding:0 14px;border-radius:14px;cursor:pointer;flex:none;position:relative;transition:transform .2s}
  .fabm:active{transform:scale(.95)}
  .fabm b{font-size:14px}
  .fabm b:empty{display:none}
  .fabm.has{background:var(--acc);box-shadow:0 8px 18px -8px rgba(37,99,235,.8)}
  .cats{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -12px;padding-left:12px;padding-right:12px;width:calc(100% + 24px)}.cats::-webkit-scrollbar{display:none}.chip{white-space:nowrap;flex:none;padding:9px 14px;font-size:14px}
  .rows{margin:4px 0 2px}
  .row{padding:14px 16px;min-height:64px}.row .n{font-size:17px}.row .n small{font-size:14px}
  .ghead{padding:12px 16px}
  /* hesap paneli = alttan kayan sayfa */
  .panel{position:fixed;left:0;right:0;bottom:var(--dockh,140px);top:auto;z-index:28;border-radius:22px 22px 0 0;max-height:calc(100dvh - var(--dockh,140px) - 70px);overflow:auto;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);animation:none;box-shadow:0 -20px 50px -20px rgba(15,23,42,.5);padding-bottom:8px}
  .panel.open{transform:none}
  .panel::before{content:"";display:block;width:44px;height:5px;border-radius:5px;background:#cbd5e1;margin:10px auto -6px}
  .closem{display:inline-block;border:0;background:var(--txt);color:#fff;font:inherit;font-size:12px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer}
  .backdrop{display:block;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:25;opacity:0;pointer-events:none;transition:opacity .3s}
  .backdrop.on{opacity:1;pointer-events:auto}
  .item input{font-size:17px;padding:10px}
  input,button{-webkit-tap-highlight-color:transparent}
  .toast{bottom:calc(var(--dockh,140px) + 12px)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <h1>Fiyat Listesi</h1>
      <p>Yaz, bul, hesapla — kâğıda bakmak yok.</p>
    </div>
    <div class="dates" id="dates"></div>
  </div>

  <div class="modes" id="modes">
    <button class="on" data-m="fiyat">Fiyat</button>
    <button data-m="stok">Stok <span class="mdot" id="stokDot"></span></button>
  </div>

  <div class="search" id="dock">
    <div class="seg" id="vade"></div>
    <div class="sbox" id="sbox">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="örn. 8 mm 1500 · npu 160 · köşebent 50 · hea 200 · yücel" autocomplete="off" autofocus>
      <div class="kbd"><span>↑↓</span><span>Enter</span><span>Esc</span></div>
      <button class="clear" id="clr" title="Temizle">×</button>
      <button class="fabm" id="fab" title="Hesap"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="2.5" width="16" height="19" rx="3"/><path d="M8 7h8M8 12h3M13 12h3M8 16.5h3M13 16.5h3"/></svg><b id="fabn"></b></button>
    </div>
  </div>

  <div class="rows">
    <div class="cats" id="cats"></div>
    <div class="cats" id="scats" style="display:none"></div>
  </div>
  <div class="meta" id="meta"></div>

  <div class="grid">
    <div id="outWrap">
      <div id="out"></div>
      <div id="stokOut" style="display:none"></div>
    </div>
    <aside class="panel" id="panel">
      <div class="phead"><h2>Hızlı Hesap</h2><div style="display:flex;gap:6px"><button id="clearCalc">Temizle</button><button id="closeCalc" class="closem">Kapat</button></div></div>
      <div class="pbody" id="pbody"></div>
    </aside>
  </div>

  <div class="notes" id="notes"></div>
</div>
<div class="backdrop" id="backdrop"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   VERİ — Yeni liste geldiğinde sadece burası güncellenir.
   p: [Peşin, 30, 60, 90]  (TL/ton)   s: arama için ölçü sayıları
   ========================================================= */
const LISTS = {
  SAC:   {name:"Saclar",  date:"27.10.2026"},
  HADDE: {name:"Hadde",   date:"12.10.2026"}
};
const CATS = {
  SAC:    {t:"Saclar (ST-37)",        list:"SAC",   c:"#2563eb"},

const STOK={data:null,err:null,grp:"ALL",zero:false,at:0};
const snorm=t=>norm(t).replace(/\s*x\s*/g,"x");
async function loadStok(force){
  try{
    const r=await fetch("stok.json?t="+(force?Date.now():Math.floor(Date.now()/60000)),{cache:"no-store"});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    j.kalemler.forEach(it=>{it.txt=snorm([it.k,it.g,it.a].join(" "));it.nums=new Set(norm(it.a).split(/[^0-9.]+/).filter(Boolean).map(Number));it.t=(it.d||[]).reduce((x,y)=>x+(+y||0),0);});
    STOK.data=j;STOK.err=null;STOK.at=Date.now();
  }catch(e){STOK.err=e;}
  renderStokStatus();if(mode==="stok")renderStok();
}
function ago(iso){const d=(Date.now()-new Date(iso))/60000;if(isNaN(d))return "";if(d<1)return "az önce";if(d<60)return Math.round(d)+" dk önce";if(d<1440)return Math.round(d/60)+" sa önce";return Math.round(d/1440)+" gün önce";}
function renderStokStatus(){
  const dot=document.getElementById("stokDot");dot.className="mdot";
  if(!STOK.data){dot.classList.add(STOK.err?"err":"");return;}
  const m=(Date.now()-new Date(STOK.data.guncelleme))/60000;
  dot.classList.add(m>30?"old":"ok");
}
function renderStok(){
  const out=document.getElementById("stokOut");
  if(!STOK.data){out.innerHTML=`<div class="none"><b>Stok verisi bağlı değil</b>${STOK.err?"Bilgisayardaki stok betiği henüz veri göndermemiş.":"Yükleniyor…"}</div>`;document.getElementById("meta").textContent="";return;}
  const j=STOK.data,tk=tokens();
  const m=(Date.now()-new Date(j.guncelleme))/60000;
  let res=j.kalemler.filter(it=>(STOK.grp==="ALL"||it.g===STOK.grp)&&(STOK.zero||tk.length?true:it.t!==0)&&(tk.length===0||tk.every(t=>{
    if(/^[0-9.]+$/.test(t))return it.nums.has(parseFloat(t));
    return it.txt.includes(t);})));
  if(!STOK.zero&&tk.length)res=res.filter(it=>it.t!==0).concat(res.filter(it=>it.t===0));
  const shown=res.slice(0,150);
  let html=`<div class="sbar"><span class="pill"><span class="dot" style="background:${m>30?'var(--warn)':'var(--ok)'}"></span>Güncelleme <b>${new Date(j.guncelleme).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}</b> · ${ago(j.guncelleme)}</span>${m>30?'<span class="pill" style="color:#92400e;background:var(--warn-soft);border-color:#fde68a">Güncel olmayabilir</span>':''}<button class="chip${STOK.zero?' on':''}" id="zeroT">Sıfır stoklar</button></div>`;
  if(!shown.length)html+=`<div class="none"><b>Bulunamadı</b>"${q}" için stok kaydı yok.</div>`;
  else{
    html+=`<section class="group"><div class="ghead"><h2><i style="background:var(--ok)"></i>Depo Stokları</h2><small>adet</small></div>`;
    shown.forEach((it,i)=>{
      html+=`<div class="srow${it.t===0?' zero':''}" style="animation-delay:${Math.min(i*18,250)}ms"><div class="n">${hl(it.a)}<small>${hl(it.k)}${it.g?" · "+it.g:""}${it.m?` · ${fmt(it.m)} ${(it.mb||"").toLowerCase()}`:""}</small></div><div class="tot">${fmt(it.t)}<small>TOPLAM</small></div>
      <div class="deps">${j.depolar.map((dn,di)=>`<span class="dep${(it.d[di]||0)!==0?' has':''}">${dn} <b>${fmt(it.d[di]||0)}</b></span>`).join("")}</div></div>`;
    });
    html+=`</section>`;
    if(res.length>shown.length)html+=`<div class="meta" style="text-align:center">İlk ${shown.length} kalem gösteriliyor — aramayı daraltın</div>`;
  }
  out.innerHTML=html;
  document.getElementById("meta").textContent=`${res.length} kalem`;
  document.getElementById("zeroT").addEventListener("click",()=>{STOK.zero=!STOK.zero;renderStok();});
}

const norm=s=>(s||"").toLocaleLowerCase("tr").replace(/[şŞ]/g,"s").replace(/[çÇ]/g,"c").replace(/[ğĞ]/g,"g").replace(/[ıİi̇]/g,"i").replace(/[öÖ]/g,"o").replace(/[üÜ]/g,"u").replace(/[×*]/g,"x").replace(/[,]/g,".");
D.forEach((it,i)=>{it.id=i;it.txt=norm([CATS[it.k].t,SYN[it.k],it.n,it.e].join(" "));
  it.nums=new Set(it.s.map(Number).concat(norm(it.n+" "+it.e).split(/[^0-9.]+/).filter(Boolean).map(Number)));});
const priceAt=(it,v)=>!it.p?null:(v===4?it.p[3]+2000:it.p[v]);

function tokens(){return norm(q).split(/\s+/).filter(Boolean).map(t=>t.replace(/mm$/,"")).filter(Boolean);}
function match(it,tk){
  return tk.every(t=>{
    if(/^[0-9.]+$/.test(t)){ return it.nums.has(parseFloat(t)); }          // sayı: sadece tam ölçü eşleşmesi
    if(/^[0-9.]+x[0-9.]+$/.test(t)){ return norm(it.n+" "+it.e).includes(t); } // 1500x6000, 40x10 gibi
    return it.txt.includes(t);
  });
}
function hl(s){const tk=tokens().filter(t=>t.length>0);let out=s;tk.forEach(t=>{const re=new RegExp("("+t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","i");out=out.replace(re,'<span class="hl">$1</span>');});return out;}

function render(){
  const tk=tokens();
  const res=D.filter(it=>(cat==="ALL"||it.k===cat)&&(tk.length===0||match(it,tk)));
  const discHit=tk.length>0&&DISC.filter(d=>tk.every(t=>norm(d.t+" "+d.alias).includes(t)));
  const out=document.getElementById("out");
  let html="";

  const visible=[];

    const c=CATS[k];
    html+=`<section class="group" style="animation-delay:${Math.min(gi*40,200)}ms"><div class="ghead"><h2><i style="background:${c.c}"></i>${c.t}</h2><small>${LISTS[c.list].name} · ${LISTS[c.list].date}</small></div>

    groups[k].forEach(it=>{
      visible.push(it.id);
      const pv=priceAt(it,vade);
      html+=`<div class="row${cursor===visible.length-1?' sel':''}" data-id="${it.id}" data-i="${visible.length-1}"><div class="n">${hl(it.n)}${it.e?`<small>${hl(it.e)}</small>`:""}</div>`;
      if(it.p){ for(let i=0;i<4;i++){const isV=(i===vade)||(vade===4&&i===3);html+=`<div class="p${isV?' v':''}">${fmt(isV?pv:it.p[i])}</div>`;} }
      else html+=`<div class="p" style="grid-column:span 4;text-align:right;color:var(--warn);font-weight:700">Fiyat soralım</div>`;
      html+=`<span class="tag${it.ask?' ask':''}">${it.tag}</span></div>`;
    });
    html+=`</section>`;
  });
  const showDisc=(tk.length===0&&(cat==="ALL"||cat==="DISC"))||(discHit&&discHit.length)||cat==="DISC";
  if(showDisc){
    const list=cat==="DISC"||tk.length===0?DISC:discHit;
    html+=`<div class="disc">`+list.map((d,i)=>`<div class="dcard" style="animation-delay:${100+i*60}ms"><h3><i style="background:${d.c}"></i>${d.t}</h3>
      <div class="drow h"><b>Et kalınlık</b><span>Peşin</span><span>30</span><span>60</span><span>90</span></div>
      ${d.rows.map(r=>`<div class="drow"><b>${r[0]}</b>${r.slice(1).map((x,j)=>`<span class="${j===vade||(vade===4&&j===3)?'v':''}">${x}</span>`).join("")}</div>`).join("")}</div>`).join("")+`</div>`;
  }
  if(!res.length&&!(discHit&&discHit.length))html=`<div class="none"><b>Bulunamadı</b>"${q}" için kayıt yok. Ölçüyü farklı yaz: <i>8 1500</i>, <i>npu 160</i>, <i>st52 10</i></div>`;
  out.innerHTML=html;
  document.getElementById("meta").textContent=tk.length?`${res.length} kalem bulundu${discHit&&discHit.length?` · ${discHit.length} iskonto tablosu`:""}${vade===4?" · 120 gün = 90 gün + 2.000 TL":""}`:`${D.length} kalem · ${Object.keys(CATS).length} grup${vade===4?" · 120 gün = 90 gün + 2.000 TL":""}`;
  out._visible=visible;
  if(cursor>=0){const el=out.querySelector(".row.sel");el&&el.scrollIntoView({block:"nearest",behavior:"smooth"});}
}

/* ---- hesap ---- */
function addCalc(id){
  const ex=calc.find(c=>c.id===id);
  if(ex){toast("Zaten hesapta");return;}
  const it=D[id]; if(!it.p){toast("Bu kalem için fiyat sorulmalı");return;}
  calc.push({id,kg:1000});renderCalc(!isMobile());toast(`${it.n} ${it.e||""} eklendi`.trim());
  if(isMobile()){qi.blur();openCalc(true);}
}
function renderCalc(focusLast){
  const b=document.getElementById("pbody");const fab=document.getElementById("fab"),fabn=document.getElementById("fabn");
  if(!calc.length){b.innerHTML=`<div class="empty">Listeden bir satıra dokun,<br>kg gir, tutarı anında gör.</div>`;fab.classList.remove("has");fabn.textContent="";return;}
  let total=0;
  b.innerHTML=calc.map((c,i)=>{const it=D[c.id];const pr=priceAt(it,vade);const amt=c.kg*pr/1000*(kdv?1.2:1);total+=amt;
    return `<div class="item"><div class="t">${it.n}<small>${CATS[it.k].t}${it.e?" · "+it.e:""}</small><em>${fmt(pr)} ₺/ton · ${VADE[vade][0]}</em></div>
    <input type="number" inputmode="decimal" value="${c.kg}" data-i="${i}" placeholder="kg">
    <div class="amt"><span>${fmt(c.kg)} kg${kdv?" · KDV dahil":""}</span><span><b>${money(amt)}</b> <button class="rm" data-i="${i}" title="Kaldır">×</button></span></div></div>`;}).join("")+
    `<div class="total"><div><small>Toplam · ${VADE[vade][0]}${kdv?" · KDV dahil":""}</small><b>${money(total)}</b></div><div style="text-align:right"><small>${calc.length} kalem</small><b style="font-size:15px">${fmt(calc.reduce((a,c)=>a+c.kg,0))} kg</b></div></div>
    <div class="opts"><label class="tog${kdv?' on':''}" id="kdv"><i></i>KDV %20 dahil</label></div>
    <button class="copy" id="copy">Teklifi kopyala</button>`;
  b.querySelectorAll("input").forEach(inp=>inp.addEventListener("input",e=>{calc[+e.target.dataset.i].kg=parseFloat(e.target.value)||0;updateAmounts();}));
  b.querySelectorAll(".rm").forEach(btn=>btn.addEventListener("click",e=>{calc.splice(+e.currentTarget.dataset.i,1);renderCalc();}));
  b.querySelector("#kdv").addEventListener("click",()=>{kdv=!kdv;renderCalc();});
  b.querySelector("#copy").addEventListener("click",copyOffer);
  fab.classList.add("has");fabn.textContent=calc.length;
  if(focusLast){const inp=b.querySelectorAll("input");const l=inp[inp.length-1];l&&(l.focus(),l.select());}
}
function updateAmounts(){ // kg yazarken yeniden çizmeden sadece tutarları güncelle
  let total=0;const items=document.querySelectorAll("#pbody .item");
  calc.forEach((c,i)=>{const pr=priceAt(D[c.id],vade);const amt=c.kg*pr/1000*(kdv?1.2:1);total+=amt;const a=items[i].querySelector(".amt");a.querySelector("span").textContent=`${fmt(c.kg)} kg${kdv?" · KDV dahil":""}`;a.querySelector("b").textContent=money(amt);});
  document.querySelector(".total b").textContent=money(total);
  document.querySelector(".total b[style]").textContent=fmt(calc.reduce((a,c)=>a+c.kg,0))+" kg";

}
function copyOffer(){
  let total=0;const lines=calc.map(c=>{const it=D[c.id];const pr=priceAt(it,vade);const amt=c.kg*pr/1000*(kdv?1.2:1);total+=amt;return `${it.n}${it.e?" "+it.e:""} — ${fmt(c.kg)} kg × ${fmt(pr)} ₺/ton = ${money(amt)}`;});
  const txt=`FİYAT TEKLİFİ (${VADE[vade][0]}${kdv?", KDV dahil":", KDV hariç"})\n`+lines.join("\n")+`\nTOPLAM: ${money(total)}`;
  navigator.clipboard.writeText(txt).then(()=>{const b=document.getElementById("copy");b.textContent="Kopyalandı ✓";b.classList.add("done");setTimeout(()=>{b.textContent="Teklifi kopyala";b.classList.remove("done");},1600);}).catch(()=>toast("Kopyalama engellendi"));
}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove("show"),1500);}

/* ---- kurulum ---- */
document.getElementById("dates").innerHTML=Object.values(LISTS).map(l=>`<span class="pill"><span class="dot"></span>${l.name} <b>${l.date}</b></span>`).join("");
document.getElementById("notes").innerHTML=NOTES.map(n=>`<div>• ${n}</div>`).join("");
const vb=document.getElementById("vade");
vb.innerHTML=VADE.map((v,i)=>`<button class="${i===vade?'on':''}${i===4?' warn':''}" data-v="${i}">${v[0]}</button>`).join("");
vb.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;vade=+b.dataset.v;vb.querySelectorAll("button").forEach(x=>x.classList.toggle("on",+x.dataset.v===vade));render();renderCalc();});
const cb=document.getElementById("cats");
cb.innerHTML=`<button class="chip on" data-k="ALL">Tümü</button>`+Object.entries(CATS).map(([k,c])=>`<button class="chip" data-k="${k}">${c.t}</button>`).join("")+`<button class="chip" data-k="DISC">İskontolar</button>`;
cb.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cat=b.dataset.k;cb.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.k===cat));cursor=-1;render();});
const qi=document.getElementById("q"),sb=document.getElementById("sbox");
qi.addEventListener("input",()=>{q=qi.value;sb.classList.toggle("has",!!q);cursor=-1;mode==="stok"?renderStok():render();});
document.getElementById("clr").addEventListener("click",()=>{qi.value="";q="";sb.classList.remove("has");cursor=-1;mode==="stok"?renderStok():render();qi.focus();});
document.getElementById("out").addEventListener("click",e=>{const r=e.target.closest(".row");if(!r)return;addCalc(+r.dataset.id);});
document.getElementById("clearCalc").addEventListener("click",()=>{calc=[];renderCalc();});
const panel=document.getElementById("panel"),backdrop=document.getElementById("backdrop");
const isMobile=()=>window.matchMedia("(max-width:980px)").matches;
function openCalc(o){panel.classList.toggle("open",o);backdrop.classList.toggle("on",o);if(o){const inp=panel.querySelector("input");inp&&setTimeout(()=>{inp.focus();inp.select();},350);}else qi.blur();}
document.getElementById("fab").addEventListener("click",()=>openCalc(!panel.classList.contains("open")));
document.getElementById("closeCalc").addEventListener("click",()=>openCalc(false));
backdrop.addEventListener("click",()=>openCalc(false));
document.addEventListener("keydown",e=>{
  const vis=document.getElementById("out")._visible||[];
  if(e.key==="Escape"){if(panel.classList.contains("open")){openCalc(false);return;}qi.value="";q="";sb.classList.remove("has");cursor=-1;render();qi.focus();return;}
  if(e.target.tagName==="INPUT"&&e.target!==qi)return;
  if(mode==="stok"&&["ArrowDown","ArrowUp","Enter"].includes(e.key))return;
  if(e.key==="ArrowDown"){e.preventDefault();cursor=Math.min(cursor+1,vis.length-1);render();}
  else if(e.key==="ArrowUp"){e.preventDefault();cursor=Math.max(cursor-1,0);render();}
  else if(e.key==="Enter"){if(cursor<0&&vis.length)cursor=0;if(vis[cursor]!==undefined)addCalc(vis[cursor]);}
  else if(e.target!==qi&&e.key.length===1&&!e.ctrlKey&&!e.metaKey){qi.focus();}
});
render();renderCalc();loadStok(false);
setInterval(()=>{if(document.visibilityState==="visible")loadStok(false);},120000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-STOK.at>120000)loadStok(true);});
new ResizeObserver(()=>document.documentElement.style.setProperty("--dockh",document.getElementById("dock").offsetHeight+"px")).observe(document.getElementById("dock"));
/* iOS Safari: klavye açılınca alt çubuğu klavyenin üstünde tut */
if(window.visualViewport){const dock=document.getElementById("dock");const fix=()=>{if(!isMobile()){dock.style.transform="";return;}
  const vv=window.visualViewport;const off=window.innerHeight-vv.height-vv.offsetTop;dock.style.transform=off>0?`translateY(-${off}px)`:"";panel.style.transform=panel.classList.contains("open")?(off>0?`translateY(-${off}px)`:""):"";};
  visualViewport.addEventListener("resize",fix);visualViewport.addEventListener("scroll",fix);}
document.addEventListener("gesturestart",e=>e.preventDefault()); // iOS pinch-zoom kapalı
</script>
</body>
